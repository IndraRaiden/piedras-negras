[variables]
# Node 22 LTS — supported with security patches into 2027.
# (Was "23", an odd-numbered non-LTS release that reached End-of-Life in 2025.)
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22", "git-lfs"]

[phases.install]
cmds = [
  "if [ -d .git ]; then git lfs install --local && git lfs pull; fi",
  "rm -rf node_modules",
  "npm ci --legacy-peer-deps"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node .output/server/index.mjs"
